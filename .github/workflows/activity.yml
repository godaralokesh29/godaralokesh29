name: Update README with recent activity

on:
  schedule:
    - cron: "0 * * * *" # runs every hour
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 allow pushing commits to your repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README with recent GitHub activity
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://github.com/godaralokesh29.atom"
          max_post_count: 5
          readme_path: './README.md'
          comment_tag_name: "RECENT-ACTIVITY"
          commit_message: "docs: update README with recent activity"
          gh_token: ${{ secrets.GITHUB_TOKEN }}

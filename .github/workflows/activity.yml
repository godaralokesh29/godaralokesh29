name: Update README with recent GitHub activity

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with recent GitHub activity
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://github.com/godaralokesh29.atom"
          max_post_count: 20
          readme_path: './README.md'
          comment_tag_name: "RECENT-ACTIVITY"
          commit_message: "docs: update README with recent activity"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Filters
          iignore_commits: "pushed godaralokesh29,update README,update activity.yaml"
          filter_commits: "true"
